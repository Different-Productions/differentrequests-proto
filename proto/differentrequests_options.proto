syntax = "proto3";

package differentrequests.v1;

import "google/protobuf/descriptor.proto";

option swift_prefix = "DR";

// Route metadata attached to an rpc: the verb and path it is served at, and the
// credential it requires.
//
// endpoint-gen reads these and emits one endpoint table, which both the server's
// router and the SDK's client are built from. Neither side writes a path, so
// neither can spell one the other does not serve.
//
// The audience is here because it is the one thing HTTP cannot state, and getting
// it wrong is what leaks one tenant's board into another's app.
//
// Three scalar options rather than one `Route` message at 51240, which is retired.
// A message-typed option can only be read by decoding it, and decoding needs the
// generated Swift for this file — which would make the generator that produces
// that Swift depend on its own output. Scalars are read as the numbers they are
// and their names resolved through the descriptor, so the generator needs no
// generated type at all.
// A surface a tenant's plan may or may not include.
//
// Every surface a plan decides is named here, and this list is what Pro is. An
// rpc serving one declares it as `(plan_gate)`; anything else serving one — a
// console screen, a push sent from the server — asks `AppConfig.includes(_:)`
// for the same surface before it does anything.
//
// There is no value for a surface every plan includes. An rpc that names no gate
// is not gated, which is the same statement made by saying nothing.
enum PlanSurface {
  // Labeled, because a build that meets a surface newer than itself still lists
  // it on a price.
  PLAN_SURFACE_UNSPECIFIED = 0 [
    (label) = "A feature this version doesn't know",
    (pitch) = "",
    (picture) = ""
  ];

  PLAN_SURFACE_ROADMAP = 1 [
    (label) = "Roadmap",
    (pitch) = "Show your users what's planned and what's being built.",
    (picture) = "M5 21V4 M5 4h12l-2.5 4L17 12H5"
  ];

  PLAN_SURFACE_CHANGELOG = 2 [
    (label) = "Changelog",
    (pitch) = "Mark a request shipped and release notes are started for you. Publish when ready.",
    (picture) =
        "M7 3h10a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z M9 8h6 M9 12h6 M9 16h3"
  ];

  // Not a paid anchor: comments are free on every plan and absent when the tenant
  // has chosen not to moderate a discussion. It is here because the gate is the
  // same gate — an AppConfig flag the server answers against before a handler
  // runs — and a second mechanism for "this app does not have that" would be a
  // second place to forget one.
  PLAN_SURFACE_COMMENTS = 3 [
    (label) = "Comments",
    (pitch) = "Users can comment on each request.",
    (picture) = "M4 5h16v11H10l-5 4v-4H4z"
  ];

  // A push notification reaching a person's phone. Devices register on every
  // plan; what the plan decides is whether the server sends to them.
  PLAN_SURFACE_PUSH = 4 [
    (label) = "Push notifications",
    (pitch) = "Users get a push notification when a request they follow ships.",
    (picture) = "M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z M10 21a2 2 0 0 0 4 0"
  ];

  // The developer answering in a request's own thread, marked as theirs.
  PLAN_SURFACE_DEVELOPER_REPLIES = 5 [
    (label) = "Replies from your team",
    (pitch) = "Reply right on the request, marked as your team.",
    (picture) = "M4 5h16v11H10l-5 4v-4H4z M8 10h8"
  ];

  // Several requests for one thing folded into one, their votes moved across.
  PLAN_SURFACE_FOLDING = 6 [
    (label) = "Merging duplicates",
    (pitch) = "Merge duplicate requests into one. Votes combine, and each user counts once.",
    (picture) =
        "M4 5a2 2 0 1 0 4 0a2 2 0 1 0-4 0 M16 5a2 2 0 1 0 4 0a2 2 0 1 0-4 0 "
        "M10 19a2 2 0 1 0 4 0a2 2 0 1 0-4 0 M6 7c0 5 6 4 6 10 M18 7c0 5-6 4-6 10"
  ];

  // The board drawn in the tint and font family its developer chose in the
  // dashboard.
  PLAN_SURFACE_APPEARANCE = 7 [
    (label) = "Your colors and font",
    (pitch) = "The requests screen uses your app's accent color and font.",
    (picture) = "M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"
  ];

  // The developer filing a request of their own, public or private.
  PLAN_SURFACE_PLANNING = 8 [
    (label) = "Your own roadmap items",
    (pitch) = "Add things nobody asked for, or keep them private until you're ready.",
    (picture) =
        "M7 11h10a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-6a2 2 0 0 1 2-2z M8 11V8a4 4 0 0 1 8 0v3"
  ];

  // The board drawn without "Powered by Different Requests".
  PLAN_SURFACE_BADGE_REMOVAL = 10 [
    (label) = "No Powered by badge",
    (pitch) = "Removes the Powered by Different Requests badge from the requests screen.",
    (picture) = "M7 8h10a4 4 0 0 1 0 8H7a4 4 0 0 1 0-8z M4 4l16 16"
  ];

  reserved 9;
  reserved "PLAN_SURFACE_TRAIT_RANKING";
}

extend google.protobuf.MethodOptions {
  HttpMethod route_method = 51243;

  // Path template relative to the API root, with `{brace}` parameters —
  // `/requests/{requestId}/comments`. A parameter name matches the field in the
  // rpc's request message that supplies it, which is what lets the generator bind
  // it without a second mapping to keep in sync.
  string route_path = 51244;

  Audience route_audience = 51245;

  // The surface a tenant's plan must include for this rpc to answer. Absent on an
  // rpc every plan includes.
  PlanSurface plan_gate = 51246;

  // What one call to this rpc is counted against. Every rpc names exactly one.
  Allowance route_allowance = 51251;

  // What one call does, in words a person reads: "Loaded the requests". Drawn beside
  // the rpc's name wherever a call is listed, because a list of rpc names is a list
  // only its authors can read. Every rpc declares one, and it is prose rather than
  // an identifier, so it is emitted as a string and never read back.
  string route_label = 51252;
}

// Which allowance a call spends before it is answered.
//
// Declared on the rpc because what a call costs is a fact about the rpc, not about
// its verb. Read off the verb, every non-GET was a write, and signing somebody in
// spent the same per-app allowance as a vote — so a flood of sign-ins refused the
// people voting.
enum Allowance {
  // Never valid on an rpc. An rpc that does not say what it costs is a generator
  // error rather than a call nothing counts.
  ALLOWANCE_UNSPECIFIED = 0;

  // Counted against nothing: a read.
  ALLOWANCE_UNCOUNTED = 1;

  // A change made by an app or by a person in it, counted against the person and
  // their app.
  ALLOWANCE_WRITE = 2;

  // Minting a session, counted against the calling address and the app, and
  // against the app's new people when it names somebody for the first time.
  ALLOWANCE_SIGN_IN = 3;
}

// Which surface an AppConfig flag decides.
//
// The rpc names a surface and the flag names the same surface, so the question
// "does this tenant have it" has one answer generated from both halves rather than
// a switch written once in the server and again in the SDK — which is what was
// there, and which had already drifted: the server's covered two surfaces and the
// SDK's covered three.
extend google.protobuf.FieldOptions {
  PlanSurface gates = 51247;

  // The longest this text may be, in characters, counted the way a person counts.
  //
  // Declared on the field because both sides need the same number for different
  // reasons: the server refuses anything longer, and the SDK stops somebody at the
  // keyboard before they lose what they wrote. Written in each repository instead,
  // it is one limit with two numbers, and the day they differ a person is refused
  // for a length their composer said was fine.
  //
  // Absent means unbounded by the contract. The 64 KB body cap still stands behind
  // every field and bounds what is read at all.
  uint32 max_characters = 51249;
}

// How an enum value is spelled when it appears in a URL.
//
// A value that rides in a query parameter needs a spelling, and that spelling has
// to be the same on the client that sends it and the server that matches on it.
// Stating it on the value is what makes it one fact. A value with no token cannot
// be sent — which is what keeps a zero sentinel out of a URL.
extend google.protobuf.EnumValueOptions {
  string url_token = 51241;
}

// Whether a board can show requests in this state.
//
// A board is what a person scrolls, and not every state belongs on one: a
// duplicate has left the board for the request it was folded into, and asking a
// board for it is asking for something that is not there. Only the server knew
// that, so the SDK offered a filter the server refused every time — the filter
// bar is built from the values that declare a `url_token`, which is deliberate
// and is how a status added to the schema reaches the bar without an edit.
//
// Stated on the value, so the side that refuses and the side that offers read one
// fact. Absent is false: a state is off the board unless it says otherwise, which
// is the safer way round — a new state offered by mistake is a filter that fails,
// and a new state left off is a filter somebody asks for.
extend google.protobuf.EnumValueOptions {
  bool shown_on_a_board = 51250;
}

// The exact token a value takes when it leaves Swift.
//
// protoc emits Int-backed enums, so a value whose contract *is* its spelling — an
// HTTP header, an authorization scheme, a media type, an id prefix — cannot carry
// that spelling in the generated enum. This option carries it, and vocab-gen reads
// it off the descriptor.
//
// Separate from `url_token`, which says how a value is spelled inside a URL this
// API already serves. These are spellings the API agrees on with everything it
// talks to, and every one of them was a literal in the server and the SDK both
// until it was declared here.
extend google.protobuf.EnumValueOptions {
  string token = 51242;
}

// What a person is shown for this value, in US English.
//
// Prose, not an identifier: nothing matches on it, nothing sends it, and there is
// no reading one back. It exists because two processes draw the same value at the
// same person — the SDK draws a status badge in an inbox, and the server writes a
// push alert about the same row — and words that disagree read as two different
// events.
//
// Unlike `url_token`, every value of a labeled enum declares one, the zero value
// included. A value with no label is an arm missing from an exhaustive switch, so
// forgetting one fails the build rather than drawing a blank.
extend google.protobuf.EnumValueOptions {
  string label = 51248;
}

// One sentence on what this value does for the developer who has it, in US English.
//
// Prose like `label`, and declared the same way: every value of an enum that has
// one declares one, the zero value included.
extend google.protobuf.EnumValueOptions {
  string pitch = 51253;
}

// The outline drawn beside this value, as one SVG path on a 24-point grid.
//
// Stroked, never filled, so every picture reads as one set. Every value of an
// enum that has one declares one, the zero value included.
extend google.protobuf.EnumValueOptions {
  string picture = 51254;
}

// The *minimum* credential a caller must present. Every rpc names exactly one;
// there is no "any" and no default, so an rpc that forgets to say is a generator
// error rather than an open endpoint.
//
// Minimum, not exact: an end-user session is always accompanied by an app key, so
// an rpc marked APP_KEY also serves a session caller — and populates the
// viewer-relative fields it would otherwise omit. The reverse never holds. An rpc
// marked END_USER rejects a bare app key.
//
// There are deliberately no console or platform-admin values. Those surfaces are
// server-rendered HTML in a private repository and have no rpcs to mark, so a
// value for them would name a caller that does not exist.
enum Audience {
  // Never valid on an rpc. Present because proto3 requires a zero value, and an
  // unset audience must fail loudly rather than resolve to the weakest one.
  AUDIENCE_UNSPECIFIED = 0;

  // `X-App-Key: dr_<hex>` alone. Identifies the tenant's app but nobody within
  // it, so these rpcs may not read or write anything user-scoped.
  AUDIENCE_APP_KEY = 1;

  // App key plus an end-user session token issued by CreateSession. Everything an
  // SDK caller does on behalf of a person: submit, vote, follow, comment, read
  // their inbox.
  AUDIENCE_END_USER = 2;
}

// The verb an rpc is served at.
//
// Each value spells itself, because a client has to put the verb on the wire and
// the spelling is what goes there. Spelled in Swift instead, it was a switch that
// mapped four values to four strings and answered GET for the two it could not
// map — so an rpc whose route was incomplete would have been sent as a read.
//
// HTTP_METHOD_UNSPECIFIED carries no spelling. There is nothing to send for it,
// and a value with no spelling cannot be sent rather than being sent as something
// else.
enum HttpMethod {
  HTTP_METHOD_UNSPECIFIED = 0;
  HTTP_METHOD_GET = 1 [(token) = "GET"];
  HTTP_METHOD_POST = 2 [(token) = "POST"];
  HTTP_METHOD_PUT = 3 [(token) = "PUT"];
  HTTP_METHOD_DELETE = 4 [(token) = "DELETE"];
}

