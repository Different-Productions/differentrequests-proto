syntax = "proto3";

package differentrequests.v1;

import "google/protobuf/descriptor.proto";

option swift_prefix = "DR";

// Route metadata attached to an rpc: the verb and path it is served at, and the
// credential it requires.
//
// endpoint-gen reads these and emits one endpoint table, which both the server's
// router and the SDK's client are built from. Neither side writes a path, so
// neither can spell one the other does not serve.
//
// The audience is here because it is the one thing HTTP cannot state, and getting
// it wrong is what leaks one tenant's board into another's app.
//
// Three scalar options rather than one `Route` message at 51240, which is retired.
// A message-typed option can only be read by decoding it, and decoding needs the
// generated Swift for this file — which would make the generator that produces
// that Swift depend on its own output. Scalars are read as the numbers they are
// and their names resolved through the descriptor, so the generator needs no
// generated type at all.
// A surface a tenant's plan may or may not include.
//
// Named on the rpc it gates rather than checked inside the handler that serves it.
// A guard written in a handler is a fact about the product kept in the one place
// nothing else looks: an rpc added to a paid surface without one answers for every
// tenant, and nothing says so until somebody notices they are getting it free.
//
// There is no value for a surface every plan includes. An rpc that names no gate
// is not gated, which is the same statement made by saying nothing.
enum PlanSurface {
  PLAN_SURFACE_UNSPECIFIED = 0;
  PLAN_SURFACE_ROADMAP = 1;
  PLAN_SURFACE_CHANGELOG = 2;

  // Not a paid anchor: comments are free on every plan and absent when the tenant
  // has chosen not to moderate a discussion. It is here because the gate is the
  // same gate — an AppConfig flag the server answers against before a handler
  // runs — and a second mechanism for "this app does not have that" would be a
  // second place to forget one.
  PLAN_SURFACE_COMMENTS = 3;
}

extend google.protobuf.MethodOptions {
  HttpMethod route_method = 51243;

  // Path template relative to the API root, with `{brace}` parameters —
  // `/requests/{requestId}/comments`. A parameter name matches the field in the
  // rpc's request message that supplies it, which is what lets the generator bind
  // it without a second mapping to keep in sync.
  string route_path = 51244;

  Audience route_audience = 51245;

  // The surface a tenant's plan must include for this rpc to answer. Absent on an
  // rpc every plan includes.
  PlanSurface plan_gate = 51246;
}

// Which surface an AppConfig flag decides.
//
// The rpc names a surface and the flag names the same surface, so the question
// "does this tenant have it" has one answer generated from both halves rather than
// a switch written once in the server and again in the SDK — which is what was
// there, and which had already drifted: the server's covered two surfaces and the
// SDK's covered three.
extend google.protobuf.FieldOptions {
  PlanSurface gates = 51247;
}

// How an enum value is spelled when it appears in a URL.
//
// A value that rides in a query parameter needs a spelling, and that spelling has
// to be the same on the client that sends it and the server that matches on it.
// Stating it on the value is what makes it one fact. A value with no token cannot
// be sent — which is what keeps a zero sentinel out of a URL.
extend google.protobuf.EnumValueOptions {
  string url_token = 51241;
}

// The exact token a value takes when it leaves Swift.
//
// protoc emits Int-backed enums, so a value whose contract *is* its spelling — an
// HTTP header, an authorization scheme, a media type, an id prefix — cannot carry
// that spelling in the generated enum. This option carries it, and vocab-gen reads
// it off the descriptor.
//
// Separate from `url_token`, which says how a value is spelled inside a URL this
// API already serves. These are spellings the API agrees on with everything it
// talks to, and every one of them was a literal in the server and the SDK both
// until it was declared here.
extend google.protobuf.EnumValueOptions {
  string token = 51242;
}

// The *minimum* credential a caller must present. Every rpc names exactly one;
// there is no "any" and no default, so an rpc that forgets to say is a generator
// error rather than an open endpoint.
//
// Minimum, not exact: an end-user session is always accompanied by an app key, so
// an rpc marked APP_KEY also serves a session caller — and populates the
// viewer-relative fields it would otherwise omit. The reverse never holds. An rpc
// marked END_USER rejects a bare app key.
//
// There are deliberately no console or platform-admin values. Those surfaces are
// server-rendered HTML in a private repository and have no rpcs to mark, so a
// value for them would name a caller that does not exist.
enum Audience {
  // Never valid on an rpc. Present because proto3 requires a zero value, and an
  // unset audience must fail loudly rather than resolve to the weakest one.
  AUDIENCE_UNSPECIFIED = 0;

  // `X-App-Key: dr_<hex>` alone. Identifies the tenant's app but nobody within
  // it, so these rpcs may not read or write anything user-scoped.
  AUDIENCE_APP_KEY = 1;

  // App key plus an end-user session token issued by CreateSession. Everything an
  // SDK caller does on behalf of a person: submit, vote, follow, comment, read
  // their inbox.
  AUDIENCE_END_USER = 2;
}

// The verb an rpc is served at.
//
// Each value spells itself, because a client has to put the verb on the wire and
// the spelling is what goes there. Spelled in Swift instead, it was a switch that
// mapped four values to four strings and answered GET for the two it could not
// map — so an rpc whose route was incomplete would have been sent as a read.
//
// HTTP_METHOD_UNSPECIFIED carries no spelling. There is nothing to send for it,
// and a value with no spelling cannot be sent rather than being sent as something
// else.
enum HttpMethod {
  HTTP_METHOD_UNSPECIFIED = 0;
  HTTP_METHOD_GET = 1 [(token) = "GET"];
  HTTP_METHOD_POST = 2 [(token) = "POST"];
  HTTP_METHOD_PUT = 3 [(token) = "PUT"];
  HTTP_METHOD_DELETE = 4 [(token) = "DELETE"];
}

