syntax = "proto3";

package differentrequests.v1;

import "differentrequests_domain.proto";
import "differentrequests_options.proto";
import "google/protobuf/timestamp.proto";

option swift_prefix = "DR";

// The SDK-facing surface: everything a third-party iOS app can reach.
//
// Ordinary HTTP endpoints carrying protobuf payloads. A verb and a path per rpc,
// identifiers in the path, filters and pagination in the query, and a body only
// where a write has one:
//
//   GET /requests?sort=top&cursor=…        Accept: application/x-protobuf
//   POST /requests                         Content-Type: application/x-protobuf
//
// Every response body is a serialized message, including a failure, which is an
// ApiError. No JSON travels in either direction on any route.
//
// Proto is the payload, not the addressing. A path segment and a query parameter
// are how HTTP names a thing and scopes a read, and they are what make a response
// cacheable and a request legible in a log; replacing them with one POST per rpc
// would buy nothing and lose all of it.
//
// endpoint-gen turns the annotations below into one endpoint table that both the
// server's router and the SDK's client are built from, so neither side writes a
// path and neither can spell one the other does not serve.
//
// Field numbers are the compatibility contract under a binary encoding. A number
// may never be reused or renumbered; a removed field is `reserved`.

// ---------------------------------------------------------------------------
// Errors
// ---------------------------------------------------------------------------

// One field of the request failed validation — a blank title, a body over the
// limit.
message InvalidArgument {
  // Which field, as the schema spells it. It sits here rather than on ApiError so
  // that it exists only under the one reason it means anything for, and a reader
  // never has to ask whether this failure is the kind that fills it in.
  //
  // Read from the generated field table. A name typed at the throw site is a second
  // spelling of something the schema already spells.
  string field = 1;
}

// The body was not the message the rpc takes at all.
//
// Separate from InvalidArgument, which names a field: there is no field to name
// when the bytes did not decode, and the remedy is different — a wrong content
// type or a stale client build, not a value somebody typed.
message Malformed {}

// Missing, expired, or unparseable credential. An expired end-user session is
// this, and the SDK's response is to re-identify rather than to log anyone out.
message Unauthenticated {}

// Authenticated, but not permitted — someone else's request, another tenant's app.
message PermissionDenied {}

message NotFound {}

// The request exists and its current state does not allow what was asked — moving
// a request that has been merged away.
//
// Not InvalidArgument: every argument was well formed and the caller is not the one
// who is wrong. Not Conflict: nothing raced, and asking again changes nothing.
message FailedPrecondition {}

// Somebody else wrote first, and this write would have replaced their decision
// rather than been applied on top of it.
//
// Its own reason because the caller's input was correct: told their argument was
// invalid, they go looking for a fault in a request that has none. The remedy is to
// read the thing again and choose against what it now says.
message Conflict {}

// The feature exists but the tenant's plan does not include it. Distinct from
// PermissionDenied because the remedy is a purchase, not a different account, and
// only the host developer can act on it — never surfaced to an end user.
message PlanRequired {}

// Too many writes.
message RateLimited {
  // How long to wait. It sits here rather than on ApiError so that it exists only
  // under the one reason it means anything for, and reads as zero nowhere else.
  //
  // The single statement of it — there is no Retry-After header in this protocol to
  // disagree with.
  int32 retry_after_seconds = 1;
}

message InternalFailure {}

// Why a call failed.
//
// A failed call returns an ApiError in the body, encoded exactly like a successful
// response. The arm of `reason` is the whole of what a client branches on: the HTTP
// status is transport, is not part of this contract, and must not be interpreted.
//
// Stated that way because a status code cannot carry the distinctions that matter —
// a 403 meaning "upgrade to Pro" and a 403 meaning "not your request" need
// different UI — and a client branching on the status while the reason sits in the
// body is reading a shadow of the error instead of the error.
message ApiError {
  // The arm is the code, so `ErrorCode` is gone. `field` and `retry_after_seconds`
  // went with it: each belonged to a single code and read as zero under every
  // other, so nothing could tell a field that was empty from one that never
  // applied. Each now sits on the one reason that carries it.
  reserved 1, 3, 4;
  reserved "code", "field", "retry_after_seconds";

  // Human-readable, English, for a developer reading a log. Not copy: a client
  // must not render this to an end user, because it is written for whoever is
  // debugging and may name internals.
  string message = 2;

  // Why the call failed, and everything that failure carries.
  //
  // Unset is a server newer than this client. A client draws its general failure for
  // that rather than guessing which reason it might have been.
  oneof reason {
    InvalidArgument invalid_argument = 5;
    Malformed malformed = 6;
    Unauthenticated unauthenticated = 7;
    PermissionDenied permission_denied = 8;
    NotFound not_found = 9;
    FailedPrecondition failed_precondition = 10;
    Conflict conflict = 11;
    PlanRequired plan_required = 12;
    RateLimited rate_limited = 13;
    InternalFailure internal_failure = 14;
  }
}

// ---------------------------------------------------------------------------
// Configuration and identity
// ---------------------------------------------------------------------------

// What the SDK needs before it has a user: which surfaces to offer, and how to
// present itself.
//
// Fetched once per launch. Everything here is a property of the tenant's plan
// and settings, so a client that hides a tab on its own guess will show the
// wrong thing the moment a tenant upgrades.
message AppConfig {
  App app = 1;

  // Whether the roadmap and changelog surfaces are enabled for this app. Both
  // are Pro anchors, so both are absent on Free — and the SDK hides the tab
  // rather than showing one that is refused when tapped.
  //
  // These are the flags the rpcs declaring `(plan_gate)` are answered against, so
  // what this advertises and what those rpcs do cannot disagree.
  bool roadmap_enabled = 2 [(gates) = PLAN_SURFACE_ROADMAP];
  bool changelog_enabled = 3 [(gates) = PLAN_SURFACE_CHANGELOG];

  // Whether comments are accepted on this app's requests. Free on every plan;
  // off when the tenant has chosen not to moderate a discussion.
  bool comments_enabled = 4 [(gates) = PLAN_SURFACE_COMMENTS];

  // Whether the SDK renders "Powered by DifferentRequests". True on Free.
  bool show_badge = 5;
}

message GetConfigRequest {}

message GetConfigResponse {
  AppConfig config = 1;
}

// Exchange the host app's identifier for a session.
//
// Upsert semantics: the same external_id returns the same user, with email,
// display name, and traits refreshed from whatever the host app now knows. That
// is what lets someone reinstall and still hold their votes.
message CreateSessionRequest {
  // Required. See EndUser.external_id — the host app's own stable id.
  string external_id = 1;

  // Optional, all three. Supplied by the host app, refreshed on every call.
  string email = 2;
  string display_name = 3;
  map<string, string> traits = 4;
}

message CreateSessionResponse {
  EndUser user = 1;

  // Bearer token for every END_USER route. Opaque to the client: its format is
  // the server's business and clients must not parse it to find the expiry —
  // that is what expires_at is for.
  string session_token = 2;

  google.protobuf.Timestamp expires_at = 3;
}

// ---------------------------------------------------------------------------
// The board
// ---------------------------------------------------------------------------

// How a board page is ordered.
enum RequestSort {
  REQUEST_SORT_UNSPECIFIED = 0;

  // Most-voted first. The default, because demand is the thing the board exists
  // to measure.
  REQUEST_SORT_TOP = 1 [(url_token) = "top"];

  // Newest first. What a triager's queue reads, and what makes an empty-looking
  // board show that it is alive.
  REQUEST_SORT_NEW = 2 [(url_token) = "new"];
}

message ListRequestsRequest {
  // Empty means every status except MERGED — a merged request is not a board
  // item. Passing MERGED explicitly is an INVALID_ARGUMENT rather than an empty
  // page, because a caller asking for it has misunderstood the model.
  repeated RequestStatus statuses = 1;

  RequestSort sort = 2;

  // Free-text search over title and body. This is also the search-before-submit
  // path: the same ranking and the same page shape, so a client does not
  // maintain two board renderers, and duplicate suppression happens at the
  // moment of writing rather than in triage afterwards.
  string query = 3;

  // Opaque continuation from a previous page, carried in the query. Empty for the
  // first page.
  //
  // A client may only echo it back, so what it encodes is the server's business.
  //
  // There is no page size: the server decides, because asking for a window the
  // server clamps is how a pager steps past results that were never delivered.
  string cursor = 4;
}

message ListRequestsResponse {
  repeated FeatureRequest requests = 1;

  // Empty when this is the last page. Presence, not a bool, so "is there more?"
  // cannot disagree with "what do I pass next?".
  string next_cursor = 2;
}

message GetRequestRequest {
  string request_id = 1;
}

message GetRequestResponse {
  FeatureRequest request = 1;
}

message CreateRequestRequest {
  string title = 1;
  string body = 2;
}

message CreateRequestResponse {
  // Returned with the author's own vote already counted. Submitting is voting —
  // asking for something and then having to vote for it separately reads as a
  // bug, and it makes first-day vote counts lie.
  FeatureRequest request = 1;
}

// ---------------------------------------------------------------------------
// Votes and follows
// ---------------------------------------------------------------------------

// Both vote routes are idempotent: voting twice is one vote, and clearing a vote
// nobody cast succeeds. A client retrying on a flaky network must not be able to
// double-count demand.
message VoteRequest {
  string request_id = 1;
}

message VoteResponse {
  // The updated request, so a client renders the new count without refetching
  // the page it is already showing.
  FeatureRequest request = 1;
}

message ClearVoteRequest {
  string request_id = 1;
}

message ClearVoteResponse {
  FeatureRequest request = 1;
}

// Following is what makes a status change reach someone. Voting follows
// implicitly — a separate opt-in that nobody finds means the loop never closes —
// so these routes exist for the reader who wants updates without adding demand,
// and for the voter who wants the vote but not the notifications.
message FollowRequest {
  string request_id = 1;
}

message FollowResponse {
  FeatureRequest request = 1;
}

message UnfollowRequest {
  string request_id = 1;
}

message UnfollowResponse {
  FeatureRequest request = 1;
}

// ---------------------------------------------------------------------------
// Comments
// ---------------------------------------------------------------------------

message ListCommentsRequest {
  string request_id = 1;

  // Oldest first, always — a discussion read newest-first is unreadable. No sort
  // parameter for that reason.
  string cursor = 2;
}

message ListCommentsResponse {
  repeated Comment comments = 1;
  string next_cursor = 2;
}

message CreateCommentRequest {
  string request_id = 1;
  string body = 2;
}

message CreateCommentResponse {
  Comment comment = 1;
}

// ---------------------------------------------------------------------------
// Notifications and devices
// ---------------------------------------------------------------------------

message ListNotificationsRequest {
  string cursor = 1;
}

message ListNotificationsResponse {
  repeated Notification notifications = 1;
  string next_cursor = 2;
}

message GetUnreadCountRequest {}

message GetUnreadCountResponse {
  int32 unread_count = 1;
}

message MarkNotificationReadRequest {
  string notification_id = 1;
}

message MarkNotificationReadResponse {
  Notification notification = 1;
}

message MarkAllNotificationsReadRequest {}

message MarkAllNotificationsReadResponse {
  int32 marked_count = 1;
}

// Upsert, called on every launch. See DeviceRegistration.token.
message RegisterDeviceRequest {
  string token = 1;
  PushEnvironment environment = 2;
}

message RegisterDeviceResponse {
  DeviceRegistration device = 1;
}

message UnregisterDeviceRequest {
  string device_id = 1;
}

message UnregisterDeviceResponse {}

// ---------------------------------------------------------------------------
// Public surfaces
// ---------------------------------------------------------------------------

message GetRoadmapRequest {}

message GetRoadmapResponse {
  // Ordered as they should be displayed, left to right: PLANNED, IN_PROGRESS,
  // SHIPPED. Order is the server's to decide so every client's roadmap reads the
  // same way.
  repeated RoadmapColumn columns = 1;
}

message ListChangelogRequest {
  string cursor = 1;
}

message ListChangelogResponse {
  // Published entries only, newest first. A draft is never on the wire.
  repeated ChangelogEntry entries = 1;
  string next_cursor = 2;
}

// ---------------------------------------------------------------------------
// The surface
// ---------------------------------------------------------------------------

// Every rpc a third-party app can call, with the verb and path it is served at.
//
// endpoint-gen emits one table from these, which the server's router and the SDK's
// client are both built from — so a path exists in exactly one place.
service RequestsService {

  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse) {
    option (route_method) = HTTP_METHOD_GET;
    option (route_path) = "/config";
    option (route_audience) = AUDIENCE_APP_KEY;
  }

  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse) {
    option (route_method) = HTTP_METHOD_POST;
    option (route_path) = "/sessions";
    option (route_audience) = AUDIENCE_APP_KEY;
  }

  rpc ListRequests(ListRequestsRequest) returns (ListRequestsResponse) {
    option (route_method) = HTTP_METHOD_GET;
    option (route_path) = "/requests";
    option (route_audience) = AUDIENCE_APP_KEY;
  }

  rpc CreateRequest(CreateRequestRequest) returns (CreateRequestResponse) {
    option (route_method) = HTTP_METHOD_POST;
    option (route_path) = "/requests";
    option (route_audience) = AUDIENCE_END_USER;
  }

  rpc GetRequest(GetRequestRequest) returns (GetRequestResponse) {
    option (route_method) = HTTP_METHOD_GET;
    option (route_path) = "/requests/{requestId}";
    option (route_audience) = AUDIENCE_APP_KEY;
  }

  rpc Vote(VoteRequest) returns (VoteResponse) {
    option (route_method) = HTTP_METHOD_PUT;
    option (route_path) = "/requests/{requestId}/vote";
    option (route_audience) = AUDIENCE_END_USER;
  }

  rpc ClearVote(ClearVoteRequest) returns (ClearVoteResponse) {
    option (route_method) = HTTP_METHOD_DELETE;
    option (route_path) = "/requests/{requestId}/vote";
    option (route_audience) = AUDIENCE_END_USER;
  }

  rpc Follow(FollowRequest) returns (FollowResponse) {
    option (route_method) = HTTP_METHOD_PUT;
    option (route_path) = "/requests/{requestId}/follow";
    option (route_audience) = AUDIENCE_END_USER;
  }

  rpc Unfollow(UnfollowRequest) returns (UnfollowResponse) {
    option (route_method) = HTTP_METHOD_DELETE;
    option (route_path) = "/requests/{requestId}/follow";
    option (route_audience) = AUDIENCE_END_USER;
  }

  rpc ListComments(ListCommentsRequest) returns (ListCommentsResponse) {
    option (route_method) = HTTP_METHOD_GET;
    option (route_path) = "/requests/{requestId}/comments";
    option (route_audience) = AUDIENCE_APP_KEY;
  }

  rpc CreateComment(CreateCommentRequest) returns (CreateCommentResponse) {
    option (route_method) = HTTP_METHOD_POST;
    option (route_path) = "/requests/{requestId}/comments";
    option (route_audience) = AUDIENCE_END_USER;
    option (plan_gate) = PLAN_SURFACE_COMMENTS;
  }

  rpc ListNotifications(ListNotificationsRequest) returns (ListNotificationsResponse) {
    option (route_method) = HTTP_METHOD_GET;
    option (route_path) = "/notifications";
    option (route_audience) = AUDIENCE_END_USER;
  }

  // The literal segment is declared before the `{notificationId}` template below it. A
  // router matching in declaration order must keep it there, or the badge count becomes
  // a lookup for a notification called "unread-count".
  rpc GetUnreadCount(GetUnreadCountRequest) returns (GetUnreadCountResponse) {
    option (route_method) = HTTP_METHOD_GET;
    option (route_path) = "/notifications/unread-count";
    option (route_audience) = AUDIENCE_END_USER;
  }

  rpc MarkAllNotificationsRead(MarkAllNotificationsReadRequest) returns (MarkAllNotificationsReadResponse) {
    option (route_method) = HTTP_METHOD_PUT;
    option (route_path) = "/notifications/read-all";
    option (route_audience) = AUDIENCE_END_USER;
  }

  rpc MarkNotificationRead(MarkNotificationReadRequest) returns (MarkNotificationReadResponse) {
    option (route_method) = HTTP_METHOD_PUT;
    option (route_path) = "/notifications/{notificationId}/read";
    option (route_audience) = AUDIENCE_END_USER;
  }

  rpc RegisterDevice(RegisterDeviceRequest) returns (RegisterDeviceResponse) {
    option (route_method) = HTTP_METHOD_PUT;
    option (route_path) = "/devices";
    option (route_audience) = AUDIENCE_END_USER;
  }

  rpc UnregisterDevice(UnregisterDeviceRequest) returns (UnregisterDeviceResponse) {
    option (route_method) = HTTP_METHOD_DELETE;
    option (route_path) = "/devices/{deviceId}";
    option (route_audience) = AUDIENCE_END_USER;
  }

  rpc GetRoadmap(GetRoadmapRequest) returns (GetRoadmapResponse) {
    option (route_method) = HTTP_METHOD_GET;
    option (route_path) = "/roadmap";
    option (route_audience) = AUDIENCE_APP_KEY;
    option (plan_gate) = PLAN_SURFACE_ROADMAP;
  }

  rpc ListChangelog(ListChangelogRequest) returns (ListChangelogResponse) {
    option (route_method) = HTTP_METHOD_GET;
    option (route_path) = "/changelog";
    option (route_audience) = AUDIENCE_APP_KEY;
    option (plan_gate) = PLAN_SURFACE_CHANGELOG;
  }
}
