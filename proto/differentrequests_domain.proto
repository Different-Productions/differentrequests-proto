syntax = "proto3";

package differentrequests.v1;

import "differentrequests_options.proto";
import "google/protobuf/timestamp.proto";

// Types carry a `DR` prefix. The names in here are the most generic words in the
// domain — App, Comment, Plan, Notification — and Notification alone already shadows
// Foundation's. A consumer should not have to rename its own configuration type
// because the contract claimed a common noun, which is the same reason igdb.proto
// keeps its package prefix and arrives as Proto_Game.
option swift_prefix = "DR";

// The DifferentRequests domain: what a feature-request board is made of.
//
// These messages are both the domain vocabulary and the payloads the API
// returns. There is deliberately no separate "entity" layer mirroring them —
// two shapes for one concept is how a status enum ends up written three times.
//
// What is NOT here: storage layout. No partition keys, no sort keys, no GSI
// projections, no table names. The storage model is designed against different
// constraints (access patterns, tenant isolation, hot-partition avoidance) and
// is free to look nothing like this.
//
// A consequence worth stating: there are no Vote or Follow messages, even
// though storage certainly holds vote and follow rows. Nobody on the wire ever
// asks for a list of votes — a caller needs the count and whether *they*
// voted, which is what FeatureRequest.viewer carries. The absence is the
// contract doing its job, not an omission.
//
// Ids are opaque strings. Their internal shape belongs to storage; a consumer
// may only compare them for equality and echo them back.

// What an app is entitled to. Two tiers, deliberately: the intermediate tiers
// tracked previously described a product with no buyers.
enum Plan {
  PLAN_UNSPECIFIED = 0;

  // Spelled because an operator names a plan on the command line when provisioning
  // an app. A value with no spelling cannot be named, which is what keeps the
  // zero sentinel off the console.
  PLAN_FREE = 1 [(url_token) = "free"];
  PLAN_PRO = 2 [(url_token) = "pro"];
}

// One board, belonging to one tenant, embedded in one iOS app.
//
// The unit of isolation. Every request, user, vote, and comment below is scoped
// to an app, and an app key grants access to exactly one — so "which app is
// this?" is answered by the credential, never by a caller-supplied id. Where an
// app_id appears on a message below it is describing what the server resolved,
// not accepting what the client claimed.
message App {
  string id = 1;
  string tenant_id = 2;
  string name = 3;
  google.protobuf.Timestamp created_at = 4;

  // What this app is entitled to, and the only thing GetConfig consults. An app
  // is both the unit of isolation and the unit of purchase, so both questions an
  // app key answers — which board, and which surfaces — are answered by the row
  // the key already resolves to.
  Plan plan = 5;
}

// A person inside a host app, identified without ever signing up.
//
// The host app already knows who its users are; making them create a second
// account to ask for a feature is how boards end up empty. So the host app
// hands us its own stable identifier and we mint a session against it.
message EndUser {
  string id = 1;

  // The host app's own identifier for this person, unique within the app. The
  // dedupe key: the same external_id on a new device is the same person, which
  // is what lets someone keep their vote history after a reinstall.
  //
  // Chosen by the host developer, so it must be treated as untrusted input and
  // never rendered without escaping.
  string external_id = 2;

  // Both optional, and both only ever supplied by the host app. Absent when the
  // developer chooses not to share them — the board works without either, and a
  // request from someone with no name renders as anonymous rather than failing.
  string email = 3;
  string display_name = 4;

  // Arbitrary host-app attributes (plan, cohort, install date) carried so a
  // triager can see who is asking. Untrusted, unindexed, and never used for
  // authorization.
  map<string, string> traits = 5;

  google.protobuf.Timestamp created_at = 6;
}

// The author of a request or comment, denormalized onto what embeds it.
//
// A board renders 25 requests; resolving each author separately would be 25
// extra reads to render a name. Carrying the name here is not a cache — the
// display name at write time is what the reader should see.
message UserRef {
  string id = 1;
  string display_name = 2;
}

// Which kind of state a request is in, as a tag with nothing attached.
//
// This is what a caller *filters* by and what a roadmap groups by:
// `?statuses=open,planned` names kinds, not the things inside them. Where a
// request's own state lives — and what that state carries — is
// `FeatureRequest.state`.
//
// Six kinds, each with an action attached. A state nobody acts on is a state
// that fills up: "under review" is what an untriaged board looks like, and OPEN
// already says that honestly.
enum RequestStatus {
  // Labeled, unlike every other zero sentinel here, because a build that meets a
  // status newer than itself still has to draw a badge and still has to write a
  // push alert. This is the word both of them use.
  REQUEST_STATUS_UNSPECIFIED = 0 [(label) = "Unknown"];

  // Submitted, not yet triaged. What every request starts as, and the queue a
  // triager works through.
  REQUEST_STATUS_OPEN = 1 [(url_token) = "open", (label) = "Open"];

  // Accepted, not started.
  REQUEST_STATUS_PLANNED = 2 [(url_token) = "planned", (label) = "Planned"];

  REQUEST_STATUS_IN_PROGRESS = 3 [(url_token) = "in-progress", (label) = "In Progress"];

  // Built and released. Terminal.
  REQUEST_STATUS_SHIPPED = 4 [(url_token) = "shipped", (label) = "Shipped"];

  // Refused, with a reason the author can read. Terminal. A decline with no
  // reason reads as being ignored, so `decline` below is required in this state.
  REQUEST_STATUS_DECLINED = 5 [(url_token) = "declined", (label) = "Declined"];

  // The same ask, already on the board. Its votes move to the request it
  // duplicates, which is the whole point of saying so rather than declining it.
  // `duplicate_of_request_id` is required in this state and meaningless in every
  // other. A duplicate leaves the board but keeps answering on its own detail
  // route, because someone holding a link to it should be told where their vote
  // went rather than shown a 404.
  REQUEST_STATUS_DUPLICATE = 6 [(url_token) = "duplicate", (label) = "Duplicate"];
}

// A reusable reason a tenant declines things, defined once in the console.
//
// An entity rather than an enum because the honest reasons are per-product
// ("outside our platform's capabilities", "conflicts with our roadmap") and a
// closed set here would force every tenant into ours. Reusable because a
// triager clearing twenty requests will not write twenty explanations, and
// declining silently is worse than declining bluntly.
message DeclineReason {
  string id = 1;
  string app_id = 2;

  // Shown to end users on every request declined for this reason.
  string label = 3;

  // Optional longer explanation, shown on the request detail.
  string description = 4;
}

// Why one specific request was declined.
message RequestDecline {
  DeclineReason reason = 1;

  // Optional free text for this request specifically, in addition to the
  // reason's own copy. Author-visible: written by an operator for the person who
  // asked.
  string note = 2;

  // When a request entered this state is the request's own `entered_state_at`.
  // Carried here as well, it was a second copy of one instant, and two copies of
  // one instant is how a detail page and a changelog come to disagree.
  reserved 3;
  reserved "declined_at";
}

// ---------------------------------------------------------------------------
// What a state carries
// ---------------------------------------------------------------------------

// A request's state, as one arm carrying exactly what that state means.
//
// These are the arms of `FeatureRequest.state`. Before them, a request held a
// status *and* a decline *and* a merge target as three free fields, with the
// rule between them written in a comment — so `{status: SHIPPED, decline: {…}}`
// was a legal message, and the SDK drew both without consulting the status.
//
// The arm IS the state, so no arm can carry another's evidence, and a client
// switching over them stops compiling when a seventh is added.

// The three states that are the answer and nothing else. Empty because there is
// nothing further to say about them, and a message rather than a bare arm
// because a `oneof` arm takes a type — which is also where a state that later
// earns a field puts it, without any client having to learn a new one.
message RequestOpen {}
message RequestPlanned {}
message RequestInProgress {}

// Built and released.
message RequestShipped {}

// The same ask as another request, which now carries this one's votes.
message RequestDuplicate {
  // Required by this shape rather than by a comment, so a duplicate that names
  // nowhere cannot be written. A duplicate keeps answering on its own detail
  // route so somebody holding a link is told where their vote went.
  string duplicate_of_request_id = 1;
}

// The calling end user's own relationship to a request.
//
// Separate from the counts because these two fields are the entire difference
// between a board that feels like a form and one that feels like a room: the
// vote button has to already know it has been pressed.
message ViewerState {
  // Named `voted` rather than `has_voted`: protoc-gen-swift reserves `has<Field>` for message
  // presence, so a bool called has_voted generates as `hasVoted_p` and that suffix would show up
  // at every call site in the server, the SDK, and every view.
  bool voted = 1;

  bool is_following = 2;

  // Whether the caller wrote it, so a client can offer to withdraw it.
  bool is_author = 3;
}

message FeatureRequest {
  string id = 1;
  string app_id = 2;

  // Absent when the author has been deleted, or when the request was created in
  // the console rather than by a user. A request with no author is normal.
  UserRef author = 3;

  string title = 4;
  string body = 5;

  // A status, a decline and a `merged_into_request_id` as three independent fields,
  // with "set only when" written between them in prose. Every disagreement was a
  // legal message: shipped carrying a refusal, declined carrying no reason at
  // all, open pointing at a request it had been folded into. `state` below is
  // the same information as one arm, where none of those can be spelled.
  reserved 6, 7, 8;
  reserved "status", "decline", "merged_into_request_id";

  // Demand. Counted, not summed from a returned list — the list is paginated and
  // the count is not.
  int32 vote_count = 9;
  int32 comment_count = 10;

  // Absent for an app-key caller, who is nobody in particular.
  ViewerState viewer = 11;

  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;

  // Named for the status it followed, and duplicated by RequestDecline's own
  // instant. `entered_state_at` below is the one instant, on the message that
  // owns the state.
  reserved 14;
  reserved "status_changed_at";

  // Where this request sits, carrying what that answer means.
  //
  // Unset is a request written before this field existed, or by a client newer
  // than this one. A reader draws what it can and says nothing about the rest;
  // it is not an error.
  oneof state {
    RequestOpen open = 15;
    RequestPlanned planned = 16;
    RequestInProgress in_progress = 17;
    RequestShipped shipped = 18;
    RequestDecline declined = 19;
    RequestDuplicate duplicate = 20;
  }

  // When the request entered the state above. What "recently triaged" sorts on
  // and what the changelog reads. Distinct from updated_at, which also moves
  // when a vote lands.
  google.protobuf.Timestamp entered_state_at = 21;

  // How many other requests were folded into this one, so a list can say a row
  // answers for more people than its own vote count suggests. Counted rather
  // than summed from a returned list, the same as the two counts above; the
  // duplicates themselves come back on the detail read.
  int32 duplicate_count = 22;
}

// Who wrote a comment, in the sense that decides how it is presented.
//
// An official reply has to be visibly official. Rendering the developer's answer
// identically to another user's guess is how a board loses its authority.
enum CommentAuthorRole {
  COMMENT_AUTHOR_ROLE_UNSPECIFIED = 0;

  // An end user of the host app.
  COMMENT_AUTHOR_ROLE_USER = 1;

  // A console operator for this tenant, speaking for the product.
  COMMENT_AUTHOR_ROLE_TEAM = 2;
}

// A comment an operator has taken down.
//
// It carries no text, which is the point: a hidden comment used to be a body
// field beside an `is_hidden` flag, and `{is_hidden: true, body: "…"}` was a
// legal message. One line of Swift emptied it on one read path, so any second
// reader — a console page, a push payload, a future GetComment — would have
// served the text a moderator removed.
//
// Whoever builds hiding keeps the original in storage, not here: the row is what
// makes the decision reversible and stops the same abuse being re-reported, and
// storage is where a fact the wire must never carry belongs.
message CommentHidden {
  google.protobuf.Timestamp hidden_at = 1;
}

message Comment {
  string id = 1;
  string request_id = 2;

  // Absent for a deleted author, as on FeatureRequest.
  UserRef author = 3;
  CommentAuthorRole author_role = 4;

  // A body beside a flag saying the body is not there. The flag could not empty
  // the field; only a reader could, and only if it remembered to.
  //
  // Only `is_hidden` is reserved by name. `body` keeps its name at a new number
  // because it is the same fact — a JSON reader spelling `body` still means the
  // text — while field 5 stays reserved so nothing writes the old slot.
  reserved 5, 6;
  reserved "is_hidden";

  google.protobuf.Timestamp created_at = 7;

  // What this comment says, or that it no longer says it.
  //
  // Unset is a row written before this field existed, or by a server newer than
  // this client. A reader draws nothing for it rather than an empty bubble.
  oneof content {
    string body = 8;
    CommentHidden hidden = 9;
  }
}

// Why someone is being told something. The kinds are the events worth
// interrupting a person for — nothing here fires on a vote, because a request
// gaining its fortieth vote is not news to its author.
// What a notification is about, carrying exactly what that news needs.
//
// These are the arms of `Notification.news`. Before them a notification held a
// kind *and* a status *and* a merge target as three free fields, with the rule
// between them in a comment — so a COMMENT_ADDED carrying a merge target was a
// legal message, and a client that tapped it went somewhere the news never
// mentioned.

// A request you authored, voted for, or follow changed state.
message StatusChangedNews {
  // The status it moved to. A tag, not the request's whole state: an inbox row
  // says "moved to Planned" and taps through for the rest.
  RequestStatus new_status = 1;
}

// Someone commented on a request you follow.
message CommentAddedNews {}

// A request you followed turned out to already be on the board.
message RequestDuplicateNews {
  // Where the vote went, so a tap lands on the request that now holds it.
  // Required by this shape rather than by a comment.
  string duplicate_of_request_id = 1;
}

// How one piece of news is headlined, in the words a person reads.
//
// Declared here because the same news is drawn at the same person twice, by two
// processes: the SDK draws an inbox row, and the server writes the push alert
// about that row. Words that disagree read as two separate events, and until this
// enum existed each repository typed its own list with nothing comparing them.
//
// No field carries this value and none ever will — the arm of `Notification.news`
// is what a reader branches on, and the compiler is what makes that exhaustive.
// What this enum holds is the words, so that branching in two places still spells
// them one way.
//
// STATUS_CHANGED is the word the headline *opens* with, and the status's own label
// follows it: "Now Planned". The other three are whole headlines.
enum NotificationHeadline {
  // News from a server newer than the reader. It still happened and the request
  // title still says what it happened to, so the row says that much rather than
  // nothing.
  NOTIFICATION_HEADLINE_UNSPECIFIED = 0 [(label) = "Updated"];

  NOTIFICATION_HEADLINE_STATUS_CHANGED = 1 [(label) = "Now"];
  NOTIFICATION_HEADLINE_COMMENT_ADDED = 2 [(label) = "New comment"];
  NOTIFICATION_HEADLINE_REQUEST_DUPLICATED = 3 [(label) = "Already on the board"];
}

// One item in an end user's inbox.
//
// Carries the request title rather than only its id, so an inbox renders in one
// read and a push notification body can be built without a second lookup.
message Notification {
  string id = 1;
  string user_id = 2;

  // A kind, a status and a `merged_into_request_id` as three independent fields,
  // with "for STATUS_CHANGED" and "for REQUEST_MERGED" written between them in prose.
  // `news` below is the same information as one arm, where a kind cannot carry
  // another kind's payload.
  reserved 3, 6, 7;
  reserved "kind", "new_status", "merged_into_request_id";

  string request_id = 4;
  string request_title = 5;

  // Absent while unread. A timestamp rather than a bool so "mark all read"
  // records when, and so an unread badge is a count of absences.
  google.protobuf.Timestamp read_at = 8;

  google.protobuf.Timestamp created_at = 9;

  // What happened. Unset is a row written before this field existed, or by a
  // server newer than this client: an inbox draws the title it already has and
  // says nothing it cannot support.
  oneof news {
    StatusChangedNews status_changed = 10;
    CommentAddedNews comment_added = 11;
    RequestDuplicateNews request_duplicated = 12;
  }
}

// Which APNs environment a device token was minted in. A sandbox token pushed to
// production fails per-token with no useful error, so the client states it.
enum PushEnvironment {
  PUSH_ENVIRONMENT_UNSPECIFIED = 0;
  PUSH_ENVIRONMENT_SANDBOX = 1;
  PUSH_ENVIRONMENT_PRODUCTION = 2;
}

message DeviceRegistration {
  string id = 1;

  // The APNs device token, hex. Rotates on reinstall and can be silently
  // invalidated by Apple, so registration is an upsert the client repeats on
  // every launch rather than a one-time write.
  string token = 2;

  PushEnvironment environment = 3;

  google.protobuf.Timestamp registered_at = 4;
}

// A published note about something that shipped.
//
// Separate from a SHIPPED request rather than derived from one: a release is
// usually several requests plus work nobody asked for, and it needs prose the
// requests do not have.
message ChangelogEntry {
  string id = 1;
  string app_id = 2;

  string title = 3;
  string body = 4;

  // Optional version string as the host app spells it — "2.4.0". Free text
  // because it has to match what the developer shipped, not a scheme of ours.
  string version = 5;

  // Requests this release answers, so the people who asked can be told and the
  // entry can link back to what they filed.
  repeated string request_ids = 6;

  // Absent while a draft. Presence is what makes an entry public, so an
  // unpublished entry is never a filter a caller can spell wrong.
  google.protobuf.Timestamp published_at = 7;

  // When the entry came into existence, which for a draft is when the request
  // it answers shipped. Always present, unlike published_at, so an entry can
  // be ordered and addressed before anybody has published it.
  google.protobuf.Timestamp created_at = 8;
}

// One column of the public roadmap.
//
// Grouped by status rather than by a tenant-defined column set: the roadmap and
// the triage queue must show the same truth, and a second grouping to keep in
// sync with status would drift from it.
message RoadmapColumn {
  RequestStatus status = 1;

  // The column's requests, ranked by demand. Deliberately a bounded page — a
  // roadmap is a summary, and a column with 400 planned items is answered by
  // the board, not the roadmap.
  repeated FeatureRequest requests = 2;

  // How many the column holds in total, which is usually more than were
  // returned.
  int32 total_count = 3;
}
